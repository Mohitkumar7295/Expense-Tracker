spring.application.name=backend
server.port=${PORT:8080}

# MongoDB Configuration (Supports MONGODB_URI, MONGO_URI, or MONGODB_URL from env)
spring.data.mongodb.uri=${MONGODB_URI:${MONGO_URI:${MONGODB_URL:mongodb://127.0.0.1:27017/expense_tracker}}}

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://expense-tracker-xi-lake.vercel.app,https://*.vercel.app}

# JavaMail Configuration (Configured via environment variables)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
